<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Perfil del Usuario - Plataforma Estatal de Eficiencia Energética</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Montserrat, sans-serif;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #f4f4f4;
        }

        .contenedor {
            width: 95%;
            max-width: 1400px;
            margin: 10px auto;
            border: 2px solid #000;
            background: white;
        }

        /* ENCABEZADO */

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            border-bottom: 2px solid #000;
        }

        .logos img {
            height: 65px;
            width: auto;
        }

        .titulo {
            flex: 1;
            text-align: center;
            font-size: 25px;
            font-weight: bold;
        }

        /* CONTENIDO */

        .principal {
            position: relative;
            padding: 20px;
            min-height: 500px;
        }

        .fondo {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .fondo img {
            width: 60%;
            opacity: 0.07;
        }

        /* ETAPAS */

        .etapas {
            position: relative;
            z-index: 2;

            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;

            margin-bottom: 30px;
        }

        .etapa {

            border: none;

            padding: 10px 18px;

            border-radius: 20px;

            font-size: 13px;
            font-weight: 600;

            cursor: pointer;

            transition: .3s;
        }

        .etapa:hover {

            transform: translateY(-2px);

            box-shadow: 0 3px 8px rgba(0, 0, 0, .15);

        }

        .acciones {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn {
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: .3s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-guardar {
            background: #701F2F;
            color: white;
        }

        .btn-continuar {
            background: #2E7D32;
            color: white;
        }

        .menu-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2E7D32;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: .3s;
        }

        .menu-btn:hover {
            background: #1B5E20;
        }

        .usuario-panel {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            min-width: 180px;
        }

        .usuario-nombre {
            font-size: 14px;
            color: #555;
            font-weight: 600;
        }

        .btn-salir {
            background: #701F2F;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 10px 18px;
            cursor: pointer;
            transition: .30s;
            font-weight: 600;
        }

        .btn-salir:hover {
            background: #8b3042;
        }

        /* FORMULARIO */

        .formulario {
            position: relative;
            z-index: 2;

            max-width: 900px;
            margin: auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .card h3 {
            color: #701F2F;
            margin-bottom: 20px;
            border-bottom: 2px solid #701F2F;
            padding-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo label {
            margin-bottom: 6px;
            font-weight: 600;
        }

        .campo input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .input-select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            width: 100%;
            background: white;
        }

        .tabla-censo {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .tabla-censo th {
            background: #701F2F;
            color: white;
            padding: 12px;
            border: 1px solid #ddd;
        }

        .tabla-censo td {
            padding: 10px;
            border: 1px solid #ddd;
        }

        .tabla-censo tr:nth-child(even) {
            background: #f5f5f5;
        }

        .readonly {
            background: #f0f0f0;
        }

        .generacion-detalle {
            display: none;
        }

        /* PIE */

        footer {
            background: #701F2F;
            padding: 8px 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            min-height: 70px;
        }

        .footer-logo-izq {
            height: 50px;
            width: auto;
        }

        .footer-logo-der {
            height: 50px;
            width: auto;
        }

        .tabla-plan {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .tabla-plan th {
            background: #701F2F;
            color: white;
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        .tabla-plan td {
            padding: 10px;
            border: 1px solid #ddd;
        }

        .tabla-plan tr:nth-child(even) {
            background: #f7f7f7;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }

        .sidebar {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
        }

        .sidebar h3 {
            color: #701F2F;
            margin-bottom: 15px;
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar li {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .kpis {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .kpi {
            background: white;
            border-left: 5px solid #701F2F;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
        }

        .kpi h4 {
            color: #666;
            margin-bottom: 10px;
        }

        .kpi span {
            font-size: 24px;
            font-weight: bold;
            color: #701F2F;
        }

        @media(max-width:1100px) {

            .dashboard {
                grid-template-columns: 1fr;
            }

            .kpis {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        /* RESPONSIVO */

        @media(max-width:900px) {

            .titulo {
                font-size: 18px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .etapas {
                flex-direction: column;
                align-items: center;
            }

            footer {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <header>

            <div class="logos">
                <img src="logos.png" alt="Logos Institucionales">
            </div>

            <div class="titulo">

                PLATAFORMA ESTATAL DE EFICIENCIA ENERGÉTICA

            </div>

            <div class="usuario-panel">

                <span id="nombreUsuario" class="usuario-nombre">

                    👤 Usuario

                </span>

                <button class="btn-salir" onclick="cerrarSesion()">

                    Cerrar sesión

                </button>

            </div>

        </header>

        <div class="principal" id="expedientePDF">

            <div class="fondo">
                <img src="fondo.png" alt="Fondo">
            </div>

            <div class="dashboard">

                <!-- MENU -->

                <div class="sidebar">

                    <h3>Expediente Energético</h3>

                    <ul>

                        <li>
                            <button class="menu-btn" onclick="window.location.href='perfil_usuario.html'">
                                ✓ Perfil del Usuario
                            </button>
                        </li>
                        <li>
                            <button class="menu-btn" onclick="window.location.href='datos_generales.html'">
                                ✓ Datos Generales
                            </button>
                        </li>
                        <li>
                            <button class="menu-btn" onclick="window.location.href='geolocalizacion.html'">
                                ✓ Geolocalización
                            </button>
                        </li>
                        <li>
                            <button class="menu-btn" onclick="window.location.href='informacion_tecnica.html'">
                                ✓ Información Técnica
                            </button>
                        </li>
                        <li>
                            <button class="menu-btn" onclick="window.location.href='servicios_electricos.html'">
                                ✓ Servicios Eléctricos
                            </button>
                        </li>
                        <li>
                            <button class="menu-btn" onclick="window.location.href='sistema_generacion.html'">
                                ✓ Sistema de Generación
                            </button>
                        </li>
                        <li>
                            <button class="menu-btn" onclick="window.location.href='evaluacion_sitio.html'">
                                ✓ Evaluación del Sitio
                            </button>
                        </li>
                        <li>
                            <button class="menu-btn" onclick="window.location.href='censo_carga.html'">
                                ✓ Censo de Carga
                            </button>
                        </li>

                    </ul>

                </div>

                <!-- CONTENIDO -->

                <div>

                    <div class="card">

                        <h3>Información General del Inmueble</h3>

                        <div class="grid">

                            <div class="campo">
                                <label>Dependencia</label>
                                <input type="text" value="Secretaría de Desarrollo Económico" readonly class="readonly">
                            </div>

                            <div class="campo">
                                <label>Municipio</label>
                                <input type="text" value="Pachuca de Soto" readonly class="readonly">
                            </div>

                            <div class="campo">
                                <label>Inmueble</label>
                                <input type="text" value="Edificio Administrativo" readonly class="readonly">
                            </div>

                            <div class="campo">
                                <label>Estado</label>
                                <input type="text" value="Validado" readonly class="readonly">
                            </div>

                        </div>

                    </div>

                    <div class="kpis">

                        <div class="kpi">
                            <h4>Consumo Anual</h4>
                            <span>125,000 kWh</span>
                        </div>

                        <div class="kpi">
                            <h4>Facturación</h4>
                            <span>$452,000</span>
                        </div>

                        <div class="kpi">
                            <h4>Potencia</h4>
                            <span>87 kW</span>
                        </div>

                        <div class="kpi">
                            <h4>Generación</h4>
                            <span>85 kW</span>
                        </div>

                    </div>

                    <div class="card">

                        <h3>Estado del Expediente</h3>

                        <div class="grid">

                            <div class="campo">
                                <label>Completitud</label>
                                <input type="text" value="100%" readonly class="readonly">
                            </div>

                            <div class="campo">
                                <label>Módulos Capturados</label>
                                <input type="text" value="9 de 9" readonly class="readonly">
                            </div>

                            <div class="campo">
                                <label>Última Actualización</label>
                                <input type="text" value="24/06/2026" readonly class="readonly">
                            </div>

                            <div class="campo">
                                <label>Estatus</label>
                                <input type="text" value="VALIDADO" readonly class="readonly">
                            </div>

                        </div>

                    </div>

                    <div class="card">

                        <h3>Accesos Rápidos</h3>

                        <div class="acciones">

                            <button class="btn btn-guardar" onclick="window.location.href='linea_base.html'">
                                Línea Base
                            </button>

                            <button class="btn btn-guardar" onclick="window.location.href='plan_trabajo.html'">
                                Plan Anual
                            </button>

                            <button class="btn btn-guardar" onclick="window.location.href='seguimiento.html'">
                                Seguimiento
                            </button>

                            <button class="btn btn-continuar" onclick="descargarExpediente()">
                                Descargar Expediente
                            </button>

                        </div>

                    </div>

                </div>

            </div>

            <!-- OBSERVACIONES -->

            <div class="card">

                <h3>Observaciones</h3>

                <textarea style="
        width:100%;
        height:80px;
        border:1px solid #ccc;
        border-radius:8px;
        padding:12px;">
La AEEH recomienda priorizar acciones de sustitución tecnológica y mantenimiento preventivo para alcanzar las metas establecidas.
    </textarea>

            </div>

        </div>

        <footer>

            <img src="Logo pie.png" alt="Logo Izquierdo" class="footer-logo-izq">

            <img src="Pie_dir.png" alt="Logo Derecho" class="footer-logo-der">

        </footer>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        async function descargarExpediente() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('landscape', 'mm', 'a4');
            const vals = [...document.querySelectorAll('.readonly')].map(e => e.value);
            const obs = document.querySelector('textarea').value;
            doc.setDrawColor(112, 31, 47); doc.rect(8, 8, 281, 194);
            doc.setTextColor(112, 31, 47); doc.setFont('montserrat', 'bold'); doc.setFontSize(18);
            doc.text('PLATAFORMA ESTATAL DE EFICIENCIA ENERGÉTICA', 148, 18, { align: 'center' });
            doc.setFontSize(14); doc.text('EXPEDIENTE EJECUTIVO DEL INMUEBLE', 148, 27, { align: 'center' });
            doc.setFontSize(9); doc.setTextColor(0);
            doc.setFont("montserrat", "bold");
            doc.setFontSize(9);
            doc.text("Fecha de generación:", 210, 28);
            doc.setFont("montserrat", "normal");
            doc.text(new Date().toLocaleDateString(), 245, 28);
            function sec(y, t) { doc.setFillColor(112, 31, 47); doc.rect(12, y, 265, 8, 'F'); doc.setTextColor(255); doc.text(t, 15, y + 5); doc.setTextColor(0); }
            sec(34, 'I. INFORMACIÓN GENERAL');
            [['Dependencia', vals[0]], ['Municipio', vals[1]], ['Inmueble', vals[2]], ['Estado', vals[3]]].forEach((r, i) => { doc.setFont('montserrat', 'bold'); doc.text(r[0] + ':', 16, 47 + i * 8); doc.setFont('montserrat', 'normal'); doc.text(r[1], 55, 47 + i * 8); });
            sec(72, 'II. INDICADORES');
            [['Consumo Anual', '125,000 kWh'], ['Facturación', '$452,000'], ['Potencia', '87 kW'], ['Generación', '85 kW']].forEach((r, i) => { let x = 16 + i * 62; doc.roundedRect(x, 83, 58, 22, 2, 2); doc.setFont('montserrat', 'bold'); doc.text(r[0], x + 3, 90); doc.setTextColor(112, 31, 47); doc.text(r[1], x + 3, 99); doc.setTextColor(0); });
            sec(111, 'III. ESTADO DEL EXPEDIENTE');
            [['Completitud', vals[4]], ['Módulos', vals[5]], ['Última actualización', vals[6]], ['Estatus', vals[7]]].forEach((r, i) => { doc.setFont('montserrat', 'bold'); doc.text(r[0] + ':', 16, 123 + i * 8); doc.setFont('montserrat', 'normal'); doc.text(r[1], 70, 123 + i * 8); });
            sec(154, 'IV. OBSERVACIONES');
            doc.roundedRect(16, 165, 255, 24, 2, 2);
            doc.setFont('montserrat', 'normal'); doc.setFontSize(9);
            doc.text(doc.splitTextToSize(obs, 245), 20, 171);
            doc.setFontSize(8); doc.setTextColor(90);
            doc.text('Gobierno del Estado de Hidalgo | Agencia Estatal de Energía | Plataforma Estatal de Eficiencia Energética', 148, 198, { align: 'center' });
            doc.save('Expediente_Ejecutivo.pdf');
        }

        const nombre =
            sessionStorage.getItem("nombre");
        if (nombre) {
            document.getElementById("nombreUsuario").textContent =
                "👤 " + nombre;
        }

        function cerrarSesion() {
            if (confirm("¿Desea cerrar la sesión?")) {
                sessionStorage.clear();
                window.location.href = "index.html";
            }

        }
    </script>
</body>

</html>
