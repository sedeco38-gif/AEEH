<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Geolocalización - Plataforma Estatal de Eficiencia Energética</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Montserrat, sans-serif;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #f4f4f4;
        }

        .contenedor {
            width: 95%;
            max-width: 1400px;
            margin: 10px auto;
            border: 2px solid #000;
            background: white;
        }

        /* ENCABEZADO */

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            border-bottom: 2px solid #000;
        }

        .logos img {
            height: 65px;
            width: auto;
        }

        .titulo {
            flex: 1;
            text-align: center;
            font-size: 25px;
            font-weight: bold;
        }

        /* CONTENIDO */

        .principal {
            position: relative;
            padding: 20px;
            min-height: 500px;
        }

        .fondo {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .fondo img {
            width: 60%;
            opacity: 0.07;
        }

        /* ETAPAS */

        .etapas {
            position: relative;
            z-index: 2;

            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;

            margin-bottom: 30px;
        }

        .etapa {

            border: none;

            padding: 10px 18px;

            border-radius: 20px;

            font-size: 13px;
            font-weight: 600;

            cursor: pointer;

            transition: .3s;
        }

        .etapa:hover {

            transform: translateY(-2px);

            box-shadow: 0 3px 8px rgba(0, 0, 0, .15);

        }

        .etapa.activa {

            background: #1565C0;
            color: white;

        }

        .etapa.pendiente {

            background: #e0e0e0;
            color: #555;

        }

        .etapa.completada {

            background: #2E7D32;
            color: white;

        }

        /* FORMULARIO */

        .formulario {
            position: relative;
            z-index: 2;

            max-width: 900px;
            margin: auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .card h3 {
            color: #701F2F;
            margin-bottom: 20px;
            border-bottom: 2px solid #701F2F;
            padding-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            width: 100%;
            min-width: 0;
        }

        .campo label {
            margin-bottom: 6px;
            font-weight: 600;
        }

        .campo input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .input-select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            width: 100%;
            background: white;
        }

        .tabla-censo {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .tabla-censo th {
            background: #701F2F;
            color: white;
            padding: 12px;
            border: 1px solid #ddd;
        }

        .tabla-censo td {
            padding: 10px;
            border: 1px solid #ddd;
        }

        .tabla-censo tr:nth-child(even) {
            background: #f5f5f5;
        }

        .readonly {
            background: #f0f0f0;
        }

        .generacion-detalle {
            display: none;
        }

        /* BOTONES */

        .acciones {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 14px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: .3s;
        }

        .btn-guardar {
            background: #701F2F;
            color: white;
        }

        .btn-continuar {
            background: #2E7D32;
            color: white;
        }

        .btn:hover {
            opacity: .90;
            transform: translateY(-2px);
        }

        .usuario-panel {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            min-width: 200px;
        }

        .page-indicator {
            font-size: 12px;
            color: #701F2F;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .usuario-nombre {
            font-size: 14px;
            color: #555;
            font-weight: 600;
        }

        .btn-salir {
            background: #701F2F;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 10px 18px;
            cursor: pointer;
            transition: .30s;
            font-weight: 600;
        }

        .btn-salir:hover {
            background: #8b3042;
        }

        /* PIE */

        footer {
            background: #701F2F;
            padding: 8px 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            min-height: 70px;
        }

        .footer-logo-izq {
            height: 50px;
            width: auto;
        }

        .footer-logo-der {
            height: 50px;
            width: auto;
        }

        /* RESPONSIVO */

        @media(max-width:900px) {

            .campo-completo {
                grid-column: span 1;
            }

            .titulo {
                font-size: 18px;
            }

            .acciones {
                justify-content: center;
            }

            .btn {
                flex: 1 1 180px;
                max-width: 220px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .etapas {
                flex-direction: column;
                align-items: center;
            }

            footer {
                flex-direction: column;
                gap: 10px;
            }
        }

        #mapa {
            height: 450px;
            width: 100%;
            border-radius: 10px;
            border: 1px solid #ccc;
        }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="app.css">
    <script src="app_state.js" defer></script>
</head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

    <div class="contenedor">

        <header>

            <div class="logos">
                <img src="logos.png" alt="Logos Institucionales">
            </div>

            <div class="titulo">

                PLATAFORMA ESTATAL DE EFICIENCIA ENERGÉTICA

            </div>

            <div class="usuario-panel">

                <span id="numeroPagina" class="page-indicator">Página 3 de 9</span>

                <span id="nombreUsuario" class="usuario-nombre">

                    👤 Usuario

                </span>

                <button class="btn-salir" onclick="cerrarSesion()">

                    Cerrar sesión

                </button>

            </div>

        </header>

        <div class="principal">

            <div class="fondo">
                <img src="fondo.png" alt="Fondo">
            </div>

            <!-- ETAPAS -->

            <div class="etapas">

                <button class="etapa completada" onclick="window.location.href='perfil_usuario.html'">
                    Perfil del Usuario
                </button>

                <button class="etapa completada" onclick="window.location.href='datos_generales.html'">
                    Datos Generales
                </button>

                <button class="etapa activa" onclick="window.location.href='geolocalizacion.html'">
                    Geolocalización
                </button>

                <button class="etapa pendiente" onclick="window.location.href='informacion_tecnica.html'">
                    Información Técnica
                </button>

                <button class="etapa pendiente" onclick="window.location.href='servicios_electricos.html'">
                    Servicios Eléctricos
                </button>

                <button class="etapa pendiente" onclick="window.location.href='sistema_generacion.html'">
                    Sistema de Generación
                </button>

                <button class="etapa pendiente" onclick="window.location.href='evaluacion_sitio.html'">
                    Evaluación del Sitio
                </button>

                <button class="etapa pendiente" onclick="window.location.href='censo_carga.html'">
                    Censo de Carga
                </button>

                <button class="etapa pendiente" onclick="window.location.href='linea_base.html'">
                    Línea Base
                </button>

            </div>
            <div class="formulario">

                <!-- UBICACIÓN -->

                <div class="card">

                    <h3>Ubicación del Inmueble</h3>

                    <div class="grid">

                        <div class="campo">
                            <label for="estadoInmueble">Estado</label>
                            <input id="estadoInmueble" type="text" value="Hidalgo" readonly class="readonly">
                        </div>

                        <div class="campo">
                            <label for="municipioInmueble">Municipio</label>
                            <input id="municipioInmueble" type="text" readonly class="readonly">
                        </div>

                        <div class="campo campo-completo">
                            <label for="direccionCompletaInmueble">Dirección</label>
                            <input id="direccionCompletaInmueble" type="text" readonly class="readonly">
                        </div>

                    </div>

                </div>

                <!-- COORDENADAS -->

                <div class="card">

                    <h3>Coordenadas Geográficas</h3>

                    <div class="grid">

                        <div class="campo">
                            <label>Latitud</label>
                            <input type="text" id="latitud">
                        </div>

                        <div class="campo">
                            <label>Longitud</label>
                            <input type="text" id="longitud">
                        </div>

                    </div>

                    <br>

                    <button class="btn" style="background:#1565C0;color:white;" onclick="obtenerUbicacion()">
                        Obtener Ubicación
                    </button>

                </div>

                <!-- MAPA -->

                <div class="card">

                    <h3>Mapa de Referencia</h3>

                    <div id="mapa"></div>

                </div>
                <!-- EVIDENCIA -->

                <div class="card">

                    <h3>Evidencia fotográfica de ubicación</h3>

                    <p class="app-photo-help">Adjunte una imagen de referencia del edificio/dependencia para apoyar la ubicación.</p>

                    <div class="grid">

                        <div class="campo">
                            <label for="fotoAccesoUbicacion">Imagen de referencia del edificio/dependencia</label>
                            <input id="fotoAccesoUbicacion" type="file" accept="image/*">
                        </div>

                    </div>

                </div>

                <!-- BOTONES -->

                <div class="acciones">

                    <button class="btn" style="background:#616161;color:white;" onclick="regresar()">
                        Regresar
                    </button>

                    <button class="btn btn-guardar" onclick="guardar()">
                        Guardar
                    </button>

                    <button class="btn btn-continuar" onclick="continuar()">
                        Guardar y Continuar
                    </button>

                </div>

            </div>
        </div>

        <footer>

            <img src="Logo pie.png" alt="Logo Izquierdo" class="footer-logo-izq">

            <img src="Pie_dir.png" alt="Logo Derecho" class="footer-logo-der">

        </footer>

    </div>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        function cargarUbicacionDesdeDatosGenerales() {
            const estado = sessionStorage.getItem("estadoInmueble") || "Hidalgo";
            const municipio = sessionStorage.getItem("municipioDatosGenerales") ?? sessionStorage.getItem("municipioInmueble") ?? "";
            const direccion = sessionStorage.getItem("direccionDependencia") ?? sessionStorage.getItem("direccionCompletaInmueble") ?? "";

            const estadoInput = document.getElementById("estadoInmueble");
            const municipioInput = document.getElementById("municipioInmueble");
            const direccionInput = document.getElementById("direccionCompletaInmueble");
            const latitudInput = document.getElementById("latitud");
            const longitudInput = document.getElementById("longitud");

            if (estadoInput) estadoInput.value = estado;
            if (municipioInput) municipioInput.value = municipio;
            if (direccionInput) direccionInput.value = direccion;
            if (latitudInput) latitudInput.value = sessionStorage.getItem("latitudInmueble") || "";
            if (longitudInput) longitudInput.value = sessionStorage.getItem("longitudInmueble") || "";
        }

        document.addEventListener("DOMContentLoaded", function () {

            cargarUbicacionDesdeDatosGenerales();

            mapa = L.map('mapa').setView([20.1011, -98.7591], 13);

            L.tileLayer(
                'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }
            ).addTo(mapa);

            mapa.on("click", function (e) {
                const lat = e.latlng.lat;
                const lon = e.latlng.lng;

                document.getElementById("latitud").value = lat.toFixed(6);
                document.getElementById("longitud").value = lon.toFixed(6);

                if (marcador) mapa.removeLayer(marcador);
                marcador = L.marker([lat, lon]).addTo(mapa);
                guardarUbicacionEnSession();
            });

        });

        let mapa;
        let marcador;

        function obtenerUbicacion() {

            if (!navigator.geolocation) {

                alert("Geolocalización no disponible.");
                return;

            }

            navigator.geolocation.getCurrentPosition(

                function (posicion) {

                    const lat = posicion.coords.latitude;
                    const lon = posicion.coords.longitude;

                    document.getElementById("latitud").value =
                        lat.toFixed(6);

                    document.getElementById("longitud").value =
                        lon.toFixed(6);

                    mapa.setView([lat, lon], 18);

                    if (marcador) {

                        mapa.removeLayer(marcador);

                    }

                    marcador = L.marker(
                        [lat, lon],
                        {
                            draggable: true
                        }
                    )
                        .addTo(mapa)
                        .bindPopup("Ubicación del inmueble")
                        .openPopup();

                    marcador.on("dragend", function () {

                        const posicion =
                            marcador.getLatLng();

                        document.getElementById("latitud").value =
                            posicion.lat.toFixed(6);

                        document.getElementById("longitud").value =
                            posicion.lng.toFixed(6);

                        guardarUbicacionEnSession();

                    });

                    guardarUbicacionEnSession();

                },

                function (error) {

                    alert(
                        "No fue posible obtener la ubicación."
                    );

                }

            );

        }

        function regresar() {

            window.location.href = 'datos_generales.html';

        }

        function guardarUbicacionEnSession() {
            sessionStorage.setItem("estadoInmueble", document.getElementById("estadoInmueble")?.value || "Hidalgo");
            sessionStorage.setItem("municipioInmueble", document.getElementById("municipioInmueble")?.value || "");
            sessionStorage.setItem("direccionCompletaInmueble", document.getElementById("direccionCompletaInmueble")?.value || "");
            sessionStorage.setItem("latitudInmueble", document.getElementById("latitud")?.value || "");
            sessionStorage.setItem("longitudInmueble", document.getElementById("longitud")?.value || "");
        }

        document.addEventListener("input", guardarUbicacionEnSession);
        document.addEventListener("change", guardarUbicacionEnSession);

        function guardar() {
            guardarUbicacionEnSession();
            alert("Información guardada correctamente.");

        }

        function continuar() {
            guardar();
            window.location.href = 'informacion_tecnica.html';

        }

        const numeroPagina = document.getElementById("numeroPagina");
        if (numeroPagina) {
            numeroPagina.textContent = "Página 3 de 9";
        }

        const nombre =
            sessionStorage.getItem("nombre");
        if (nombre) {
            document.getElementById("nombreUsuario").textContent =
                "👤 " + nombre;
        }

        function cerrarSesion() {
            if (confirm("¿Desea cerrar la sesión?")) {
                sessionStorage.clear();
                window.location.href = "index.html";
            }
        }
    </script>
</body>

</html>
